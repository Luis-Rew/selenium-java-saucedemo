name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Rodar testes (Cucumber + JUnit)
        run: ./mvnw -B test

      - name: Publicar relatório do Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/

      - name: Publicar screenshots e comparações visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-checks
          path: target/visual-checks/
          if-no-files-found: ignore
